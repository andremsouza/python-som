version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    groups:
      dev-tooling:
        patterns: ["ruff", "mypy", "pytest*", "pre-commit", "twine", "types-*", "*-stubs"]
      docs:
        patterns: ["mkdocs*"]

  # Workflow actions are pinned by SHA, so this is the only thing that moves them.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
