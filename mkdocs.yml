site_name: python-som
site_description: Python implementation of Kohonen's self-organizing map
site_url: https://andremsouza.github.io/python-som/
repo_url: https://github.com/andremsouza/python-som
repo_name: andremsouza/python-som
edit_uri: edit/master/docs/

theme:
  name: material
  features:
    - content.code.copy
    - navigation.sections
    - navigation.top
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Neighborhood functions: neighborhood-functions.md
  - Training modes: training-modes.md
  - Options and types: options-and-types.md
  - Saving and loading: save-and-load.md
  - API reference: api.md
  - Changelog: changelog.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: sphinx
            show_source: true
            show_root_heading: true
            members_order: source
            separate_signature: true

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  # index.md and changelog.md pull in README.md and CHANGELOG.md from the repository root, so
  # those files stay single-sourced rather than duplicated into docs/.
  - pymdownx.snippets:
      base_path: [.]
      check_paths: true
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
  - tables
  - toc:
      permalink: true

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

watch:
  - src/python_som
