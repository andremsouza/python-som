[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "python-som"
version = "0.4.0"
authors = [{ name = "André Moreira Souza", email = "msouza.andre@hotmail.com" }]
description = "Python implementation of the Self-Organizing Map"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICEN[CS]E*"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
# NumPy is the only thing this package needs at runtime. pandas and scikit-learn were dropped in
# 0.4.0: pandas because `np.asarray` already converts a DataFrame through the `__array__` protocol,
# and scikit-learn because its PCA and StandardScaler are twenty lines of `np.linalg.svd`. Together
# together they pulled in 8 further packages to reach that. Measured on Linux/CPython 3.12, the
# installed footprint drops from 333 MB across 10 packages to 69 MB across 1: a 264 MB reduction,
# 79% of the payload. Both remain in
# `dev`, where the differential tests re-check the replacements against them on every CI run.
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
cli = ["tqdm>=4.66"]
dev = [
    "hypothesis==6.163.0",
    "mypy==2.3.0",
    # Not runtime dependencies. The suite exercises the DataFrame path through the port, and
    # tests/test_linalg_matches_sklearn.py re-derives every PCA both ways and compares. Pinned like
    # the rest of the tooling: scikit-learn changed its default PCA solver in 1.5, and a floating pin
    # would surface that as an unrelated PR's CI failure instead of a Dependabot diff to read.
    # Split by Python version because the current majors dropped 3.10, which this package still
    # supports: same reason as tomli below, same pattern.
    "pandas==3.0.5; python_version >= '3.11'",
    "pandas==2.3.3; python_version < '3.11'",
    "scikit-learn==1.9.0; python_version >= '3.11'",
    "scikit-learn==1.7.2; python_version < '3.11'",
    # pandas-stubs 3.x needs Python >=3.11; it is dev-only, so gate it rather than
    # raising the library's own floor. mypy runs on 3.12 in CI, where it is present.
    "pandas-stubs==3.0.3.260530; python_version >= '3.11'",
    "pre-commit==4.6.1",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.0",
    # tomllib entered the stdlib in 3.11; tomli is the backport it was derived from.
    "tomli==2.4.1; python_version < '3.11'",
    "twine==7.0.0",
    "types-tqdm==4.69.0.20260728",
]
docs = [
    "mkdocs-material==9.7.7",
    # Pinned to 1.2.2 deliberately, not to the latest 1.2.3. The canonical repository,
    # github.com/mkdocs/mkdocs-redirects (245 stars, active, not archived), has tags up to v1.2.2 and
    # no v1.2.3. PyPI's 1.2.3 was published on 2026-03-28 declaring its source as
    # github.com/ProperDocs/properdocs-redirects, a repository created 2026-03-14 with 3 stars -- a
    # version upstream never tagged, released from a repository that appeared two weeks earlier while
    # the original stayed active. 1.2.2's declared source is the canonical repository and matches its
    # own v1.2.2 tag, so that is the last release whose provenance can be checked.
    #
    # Do not bump this without re-checking who publishes it.
    "mkdocs-redirects==1.2.2",
    "mkdocstrings-python==2.0.5",
]
# Static analysis used during review, kept out of `dev` so the CI jobs that never run it do not
# install it. Pinned exactly, like the rest of the tooling. Nothing here gates a merge: ruff and mypy
# are the enforced checks, and these are for the deeper passes a human asks for.
#
# `osv-scanner` is deliberately absent. The real tool is a Go binary from Google; the PyPI package of
# that name was registered on 2026-07-16 with one release, no author, no home page, and a summary of
# "Reserved name placeholder. No functionality." Install the Go binary if you want it.
#
# `guarddog` is also absent: genuine (DataDog) but first released 2022-11-28, three months *after*
# this project, so it fails the rule that a dependency should predate what it is added to. Add it
# deliberately if the supply-chain checks are wanted, not as part of a batch.
#
# `semgrep` was added and then removed. It pins `mcp==1.23.3` exactly, and that version carries
# PYSEC-2026-3481/3482/3483 (fixed in mcp 1.27.2/1.28.1) -- so the exact pin makes the advisories
# unremediable from here, and 1.172.0 is already the latest semgrep. Against that, bandit reports
# nothing in `src/`, and this is a pure-numpy library with no network, auth, crypto, SQL or
# templating, which is most of what semgrep's rulesets look for. Low coverage gained for three CVEs
# that cannot be patched. Revisit if semgrep relaxes the pin.
analysis = [
    # PyCQA, first released 2015. Security-oriented AST checks.
    "bandit==1.9.4",
    # PyPA. Reports known CVEs in the resolved dependency set; expected to report none.
    "pip-audit==2.10.1",
    # PyCQA, first released 2009. Not wired into any gate; here so the findings a contributor's IDE
    # reports can be reproduced from the command line.
    "pylint==4.0.6",
]
# Restores the install set that 0.3.0 pulled in by default, for anyone who was relying on it.
examples = [
    "matplotlib>=3.8",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "seaborn>=0.13",
]

[project.urls]
Homepage = "https://github.com/andremsouza/python-som"
Documentation = "https://andremsouza.github.io/python-som/"
Changelog = "https://github.com/andremsouza/python-som/blob/master/CHANGELOG.md"
Issues = "https://github.com/andremsouza/python-som/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/python_som"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/docs",
    "/examples",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # The 13-argument constructor is the established public API. Reducing it, or forcing the
    # arguments keyword-only, would break every existing caller for no gain in correctness.
    "PLR0913",
    "PLR0917",
    # `verbose`, `normalize` and `cyclic_*` are long-standing boolean parameters of the public
    # API. Making them keyword-only would break positional callers.
    "FBT001",
    "FBT002",
    # Conflicts with the formatter.
    "COM812",
    "ISC001",
    # This project documents parameters with `:param:` rather than a Google/NumPy section.
    "D417",
    # Per-file copyright headers are not this project's convention; the MIT terms live in
    # LICENSE and are declared in the package metadata.
    "CPY001",
]

[tool.ruff.lint.per-file-ignores]
# Tests must be able to build a DataFrame to exercise the port, and to compare our PCA against
# sklearn's differentially. The ban protects the core, not the suite that checks it.
"tests/*" = [
    "TID251",
    # Tests reach into private helpers deliberately; that is what is under test.
    "SLF001",
    # assert is the point of a test.
    "S101",
    # Tests do not need to document every parameter.
    "D103",
    "D100",
    # Magic values are the expected values being asserted.
    "PLR2004",
]
"examples/*" = ["INP001", "T201", "D100"]
# Scripts a human runs, not importable modules: a table on stdout is the deliverable, and neither
# directory should become a package just to satisfy the implicit-namespace rule.
"benchmarks/*" = ["INP001", "T201"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# The package is numpy-only at runtime, and as of 0.4.0 this ban has no per-file exemption anywhere
# under src/: the two modules that used to need one no longer import either library. Only tests are
# exempt, so the replacements can be compared against the originals.
"pandas".msg = "The core is numpy-only. Convert at the boundary in python_som/_convert.py."
"sklearn".msg = "The core is numpy-only. Linear algebra belongs in python_som/_core/_linalg.py."

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.isort]
known-first-party = ["python_som"]

[tool.mypy]
# Deliberately not pinned to python_version = "3.10". NumPy's bundled stubs use 3.12 syntax, and
# `tomllib` is 3.11+, so pinning to the floor makes mypy fail on the dependencies rather than on
# our code. Real 3.10 compatibility is covered by the CI test matrix instead.
strict = true
files = ["src", "tests"]
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

[[tool.mypy.overrides]]
module = ["sklearn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
]
markers = [
    "slow: end-to-end runs; deselect with -m 'not slow'",
]
filterwarnings = ["error"]

[tool.coverage.run]
# source_pkgs, not source: with a src layout the package under test is the installed one, and
# coverage has to resolve it by import name rather than by directory.
source_pkgs = ["python_som"]
branch = true

[tool.coverage.paths]
source = ["src/python_som", "*/site-packages/python_som"]

[tool.coverage.report]
# The suite is at 100%. A lower gate would permit a silent regression, and anything genuinely
# unreachable should carry an explicit `# pragma: no cover` a reviewer can question.
fail_under = 100
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    # A bare `...` is a Protocol method body: a declaration of shape that is never executed, since
    # the protocols are structural and nothing inherits from them. Excluded as a rule rather than
    # with four identical pragmas, and narrow enough to stay honest -- it matches only a line whose
    # entire content is an ellipsis, which in this package occurs solely in _core/_protocols.py.
    "^\\s*\\.\\.\\.$",
]

[tool.bandit]
# `assert` is how a test states its expectation, so B101 fires on every one of them and says nothing.
# Excluded by directory rather than by skipping the check, so B101 still applies to `src/`, where an
# assert *would* be wrong: asserts vanish under `python -O`, so validation must raise instead.
exclude_dirs = ["tests", ".venv", "site", "dist"]
